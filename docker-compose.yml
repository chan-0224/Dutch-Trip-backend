services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    volumes:
      - /Users/coucoo7809/.docker/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      VERSION: 1
      EVENTS: 1
      PING: 1
    restart: unless-stopped

  traefik:
    image: traefik:v3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./acme.json:/acme.json
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=coucoo7809@gmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    depends_on:
      - socket-proxy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dutchtrip
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    image: ghcr.io/chan-0224/dutchtrip:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dutchtrip?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.dutchtrip.rule=Host(`dutchtrip.duckdns.org`) && PathPrefix(`/api`)
      - traefik.http.routers.dutchtrip.entrypoints=websecure
      - traefik.http.routers.dutchtrip.tls.certresolver=letsencrypt
      - traefik.http.services.dutchtrip.loadbalancer.server.port=8080
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

volumes:
  mysql_data:
